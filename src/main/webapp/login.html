<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .home {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: url('images/login.jpeg') no-repeat center center/cover;
    }

    .home p {
      color: white;
      position: absolute;
      font-size: 32px;
      font-weight: bold;
      top: 5%;
      left: 35%;
      width: 30vw;
      text-align: center;
      z-index: 2;
    }

    .login-box {
      position: absolute;
      top: 50%;
      left: 70%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.6);
      padding: 30px 40px;
      border-radius: 15px;
      z-index: 3;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    form label {
      font-size: 20px;
      font-weight: bold;
      color: white;
    }

    input[type="email"], input[type="password"] {
      padding: 8px;
      border-radius: 5px;
      border: none;
      outline: none;
      width: 200px;
    }

    .input-1 {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 20px;
      margin-bottom: 15px;
    }

    .input-1 label {
      width: 120px;
    }

    .login {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .login input {
      background-color: orangered;
      font-size: 18px;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      width: 100px;
      height: 40px;
      cursor: pointer;
    }

    /* ✅ Responsive fix for mobile */
    @media screen and (max-width: 768px) {
      .home p {
        width: 100vw;
        left: 0%;
        text-align: center;
      }

      .login-box {
        width: 90vw;
        padding: 20px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .input-1 {
        flex-direction: column;
        align-items: flex-start;
      }

      .input-1 label {
        width: 100%;
      }

      .login {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="home">
    <p>Dreams Event Planner<br><br>Login</p>

    <div class="login-box">
      <form action="LoginServelet" method="post">
        <div class="email input-1">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter Your Email" />
        </div>
        <div class="pass input-1">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter Your Password" />
        </div>
        <div class="login">
          <input type="submit" value="Login" />
        </div>
      </form>
    </div>
  </div>
</body>
</html>
